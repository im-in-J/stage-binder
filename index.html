<style>
  :root{
    --bg:#EFF0EE; --surface:#FBFBFA; --surface-2:#F5F5F2;

    --accent:#C77817; --accent-soft:#F3E3CB;
    --ok:#2E7D4F;

    --st-n:#C0392B; --st-n-bg:#F9E0DC;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151619; --surface:#1E2023; --surface-2:#26282C;
      --ink:#E9E8E4; --ink-2:#A2A7AD; --ink-3:#71767D;
      --line:#34373C; --line-soft:#2B2E32;
      --accent:#F0A83C; --accent-soft:#3A2E1A;
      --ok:#57C98A;
      --st-y:#57C98A; --st-y-bg:#1E3A2B;
      --st-l:#F0A83C; --st-l-bg:#3A2E1A;
      --st-n:#FF8A7A; --st-n-bg:#3D2320;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151619; --surface:#1E2023; --surface-2:#26282C;
    --ink:#E9E8E4; --ink-2:#A2A7AD; --ink-3:#71767D;
    --line:#34373C; --line-soft:#2B2E32;
    --accent:#F0A83C; --accent-soft:#3A2E1A;
    --ok:#57C98A;
    --st-y:#57C98A; --st-y-bg:#1E3A2B;
    --st-l:#F0A83C; --st-l-bg:#3A2E1A;
    --st-n:#FF8A7A; --st-n-bg:#3D2320;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:15px; line-height:1.6;
  }
  button{font:inherit; cursor:pointer}
  input, textarea{font:inherit; color:inherit; font-size:16px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .wrap{max-width:1080px; margin:0 auto; padding:0 16px 56px}

  /* ── 상단바: 탭 + 저장 상태 ─────────── */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
    margin:0 -16px 18px; padding:6px 16px 0;
  }
  nav.tabs{display:flex; gap:2px; flex:1; min-width:0}
  nav.tabs button{
    appearance:none; background:none; border:none; color:var(--ink-2);
    padding:12px 14px 13px; font-size:15px; font-weight:500;
    border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap;
  }
  nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
  .save-chip{
    font-size:12px; color:var(--ink-2); flex-shrink:0;
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px;
    background:var(--surface); cursor:pointer;
  }
  .save-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex-shrink:0}
  .save-chip[data-s="saved"] .dot{background:var(--ok)}
  .save-chip[data-s="saving"] .dot{background:var(--accent)}
  .save-chip[data-s="error"] .dot{background:#FF5A48}

  /* 관리자 패널 */
  .admin-panel{
    display:none; margin-bottom:16px; padding:14px 16px; border-radius:8px;
    background:var(--surface); border:1px solid var(--line);
  }
  .admin-panel.on{display:block}
  .admin-panel .row{display:flex; gap:8px; flex-wrap:wrap}
  .admin-panel input{
    flex:1; min-width:200px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface-2); padding:8px 12px;
  }
  .admin-panel .hint{font-size:12.5px; color:var(--ink-3); margin:8px 0 0}
  .admin-panel .hint a{color:var(--accent)}
  .admin-panel .msg{color:#C0392B; font-weight:500; white-space:pre-wrap}
  .admin-panel .msg[hidden]{display:none}
  :root[data-theme="dark"] .admin-panel .msg{color:#FF8A7A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .admin-panel .msg{color:#FF8A7A} }
  .admin-panel .row + .row{margin-top:8px}
  .admin-panel .srv{margin-top:10px; font-size:12.5px; color:var(--ink-3)}
  .admin-panel .srv summary{cursor:pointer}
  .admin-panel .srv .row{margin-top:8px}

  .view{display:none}
  .view.on{display:block}

  /* 뷰어(보기 전용) 모드 */
  body:not(.admin) .admin-only{display:none !important}
  body:not(.admin) .cue-meta input[type=text],
  body:not(.admin) .cue-meta textarea{
    border-color:transparent; background:none; resize:none; pointer-events:none;
  }

  /* ── 동선표 ─────────────────────── */
  .blocking{display:grid; grid-template-columns:240px 1fr; gap:20px}

  .cuelist{display:flex; flex-direction:column; gap:14px; min-width:0}
  .cuegroup .song-h{
    font-size:12px; letter-spacing:.1em; color:var(--ink-3); font-weight:700;
    margin:0 0 6px 2px; text-transform:uppercase;
  }
  .cue{
    display:flex; align-items:center; gap:10px; width:100%;
    text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:6px; padding:9px 11px; color:var(--ink); margin-bottom:6px;
  }
  .cue .no{
    font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3);
    min-width:44px; flex-shrink:0;
  }
  .cue.on{border-color:var(--accent); background:var(--accent-soft)}
  .cue.on .no{color:var(--accent); font-weight:500}

  /* 무대: 라이트/다크 공통 — 언제나 블랙 스테이지 */
  .stage-panel{min-width:0}
  .stage{
    position:relative; aspect-ratio:16/9; border-radius:8px; overflow:hidden;
    background:#1A1B1E;
    border:1px solid #000; box-shadow:inset 0 0 60px rgba(0,0,0,.55);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .stage .tape-center{
    position:absolute; left:50%; top:0; bottom:14%; width:0;
    border-left:2px dashed rgba(255,255,255,.22);
  }
  .stage .spike{
    position:absolute; width:14px; height:14px; transform:translate(-50%,-50%);
    opacity:.5; pointer-events:none;
  }
  .stage .spike::before,.stage .spike::after{
    content:""; position:absolute; left:50%; top:50%; width:14px; height:3px;
    background:rgba(255,201,60,.65); transform:translate(-50%,-50%) rotate(45deg);
  }
  .stage .spike::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .stage .edge{
    position:absolute; font-family:"IBM Plex Mono", monospace; font-size:11px;
    letter-spacing:.18em; color:rgba(255,255,255,.45); pointer-events:none;
  }
  .edge.back{top:8px; left:50%; transform:translateX(-50%)}
  .edge.sl{left:8px; top:44%; transform:translateY(-50%); writing-mode:vertical-rl}
  .edge.sr{right:8px; top:44%; transform:translateY(-50%); writing-mode:vertical-rl}
  .stage .apron{
    position:absolute; left:0; right:0; bottom:0; height:14%;
    background:repeating-linear-gradient(45deg, rgba(255,201,60,.14) 0 10px, rgba(0,0,0,0) 10px 20px);
    border-top:2px solid rgba(255,201,60,.5);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.24em;
    color:rgba(255,255,255,.55); pointer-events:none;
  }

  .mchip{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:grab; touch-action:none;
  }
  body:not(.admin) .mchip,
  body:not(.admin) .pchip{cursor:default}
  .mchip.drag{cursor:grabbing; z-index:6}
  .mchip .dot{
    width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,.55); border:3px solid var(--c);
    color:#fff; font-weight:700; font-size:12px; letter-spacing:-.03em;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .mchip .tag{
    font-size:10.5px; color:#fff; background:rgba(0,0,0,.6);
    padding:1px 7px; border-radius:999px; white-space:nowrap;
  }

  /* 소품 (스탠딩 마이크 · 의자) */
  .pchip{
    position:absolute; transform:translate(-50%,-50%);
    width:34px; height:40px; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  .pchip.drag{cursor:grabbing; z-index:6}
  .pchip svg{width:100%; height:100%; display:block; color:#D5D7DA; pointer-events:none}
  .pchip.sel svg{color:#FFC93C; filter:drop-shadow(0 0 5px rgba(255,201,60,.6))}
  .pchip .px{
    display:none; position:absolute; top:-10px; right:-12px;
    width:24px; height:24px; border-radius:50%;
    background:#FF5A48; color:#fff; border:2px solid #1A1B1E;
    font-size:12px; line-height:1; padding:0;
    align-items:center; justify-content:center;
  }
  .pchip.sel .px{display:flex}

  .mchip.anim,.pchip.anim{transition:left .5s cubic-bezier(.25,.8,.3,1), top .5s cubic-bezier(.25,.8,.3,1)}
  @media (prefers-reduced-motion: reduce){ .mchip.anim,.pchip.anim{transition:none} }

  /* 대형 이동 (이전/다음) */
  .cue-nav{display:flex; align-items:center; gap:8px; margin-top:10px}
  .cue-nav .cue-now{
    flex:1; text-align:center; font-family:"IBM Plex Mono", monospace;
    font-size:12.5px; color:var(--ink-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cue-nav .btn{min-width:52px}

  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:12.5px; color:var(--ink-2)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{width:11px; height:11px; border-radius:50%; background:var(--c); display:inline-block}

  .cue-meta{
    margin-top:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:14px 16px; display:grid; gap:10px;
  }
  .cue-meta label{font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.08em}
  .cue-meta input[type=text]{
    width:100%; border:none; border-bottom:1px solid var(--line); background:none;
    padding:4px 2px 6px; font-weight:700;
  }
  .cue-meta textarea{
    width:100%; border:1px solid var(--line-soft); background:var(--surface-2);
    border-radius:6px; padding:9px 11px; resize:vertical; min-height:56px; line-height:1.55;
  }
  .cue-actions{display:flex; gap:8px; flex-wrap:wrap}
  .btn{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:8px 14px; font-size:13.5px; color:var(--ink); min-height:38px;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.warn{color:#C0392B}
  :root[data-theme="dark"] .btn.warn{color:#FF8A7A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.warn{color:#FF8A7A} }

  /* ── 일정표 ─────────────────────── */
  .me-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .me-set{
    flex:1 1 100%; display:grid; gap:8px; padding:12px 14px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
  }
  .me-set[hidden]{display:none}
  .me-set label{font-size:14px; font-weight:700; color:var(--ink)}
  .me-set label small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-2); margin-top:2px}
  .me-set select{
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    padding:9px 10px; min-height:44px; font-size:15px; color:var(--ink); width:100%;
  }
  .me-now{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2)}
  .me-now[hidden]{display:none}
  .me-now::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c, var(--accent))}
  .me-now b{color:var(--ink)}
  .me-change{
    appearance:none; background:none; border:none; padding:2px 4px; font-size:12.5px;
    color:var(--accent); text-decoration:underline; text-underline-offset:2px;
  }
  .me-bar .spacer{flex:1}
  #btn-att-refresh .ic{margin-right:4px}
  .sync-chip{
    font-size:12px; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:var(--surface);
  }
  .sync-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex-shrink:0}
  .sync-chip[data-s="ok"] .dot{background:var(--ok)}
  .sync-chip[data-s="busy"] .dot{background:var(--accent)}
  .sync-chip[data-s="err"] .dot{background:#FF5A48}

  .sched-list{display:flex; flex-direction:column; gap:8px; max-width:720px}
  .sched-h{font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-3); margin:10px 0 0 2px}
  .sched-h:first-child{margin-top:0}
  .sched-empty{color:var(--ink-3); font-size:13.5px; padding:20px 0; text-align:center}

  /* 바 (앞면/뒷면 뒤집기) */
  .sbar{perspective:1400px}
  .sbar-in{
    display:grid; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.35,.1,.25,1);
  }
  .sbar.flip .sbar-in{transform:rotateX(180deg)}
  @media (prefers-reduced-motion: reduce){ .sbar-in{transition:none} }
  .sbar-face{
    grid-area:1/1; display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 10px 10px 14px; min-height:68px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .sbar-face.back{transform:rotateX(180deg); background:var(--surface-2); border-color:var(--accent)}
  .sbar.today .front{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .sbar.past .front{opacity:.72}
  .sbar.off .front{opacity:.6; background:var(--surface-2)}

  .sb-date{width:64px; flex-shrink:0; line-height:1.1}
  .sb-date b{display:block; font-family:"Do Hyeon", sans-serif; font-weight:400; font-size:23px; letter-spacing:.01em}
  .sb-date span{
    display:flex; align-items:center; gap:5px; margin-top:2px;
    font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--ink-3);
  }
  .sb-date em{
    font-style:normal; color:var(--accent); font-weight:500; white-space:nowrap;
  }
  .sbar.off .sb-date b{text-decoration:line-through; color:var(--ink-3)}

  .sb-info{flex:1; min-width:0}
  .sb-con{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sb-con.empty{color:var(--ink-3); font-weight:400}
  .sb-con-in{
    width:100%; border:none; border-bottom:1px dashed var(--line); background:none;
    padding:2px 0 3px; font-size:14.5px; font-weight:500; border-radius:0;
  }
  .sb-con-in:focus{border-bottom-color:var(--accent); outline:none}
  .sb-meta{
    font-size:12px; color:var(--ink-3); margin-top:3px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .sb-meta .cnt{
    appearance:none; background:none; border:none; padding:0; font:inherit; color:inherit;
    display:inline-flex; gap:7px; align-items:center; cursor:pointer;
  }
  .sb-meta .cnt i{font-style:normal; font-weight:700}
  .sb-meta .cnt i.y{color:var(--st-y)} .sb-meta .cnt i.l{color:var(--st-l)} .sb-meta .cnt i.n{color:var(--st-n)}
  .sb-meta .cnt::after{content:"▾"; font-size:10px; color:var(--ink-3)}
  .sbar.open .sb-meta .cnt::after{content:"▴"}

  .sb-check{
    flex-shrink:0; min-width:66px; min-height:46px; padding:0 12px;
    border-radius:9px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .sb-check.none{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .sb-check[data-s="y"]{background:var(--st-y-bg); color:var(--st-y); border-color:var(--st-y)}
  .sb-check[data-s="l"]{background:var(--st-l-bg); color:var(--st-l); border-color:var(--st-l)}
  .sb-check[data-s="n"]{background:var(--st-n-bg); color:var(--st-n); border-color:var(--st-n)}
  .sb-check:disabled{opacity:.5}

  .sb-pick{flex:1; display:flex; gap:6px; min-width:0}
  .sb-pick button{
    flex:1; min-height:46px; border-radius:9px; font-weight:700; font-size:14.5px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  }
  .sb-pick button[data-p="y"].on{background:var(--st-y-bg); color:var(--st-y); border-color:var(--st-y)}
  .sb-pick button[data-p="l"].on{background:var(--st-l-bg); color:var(--st-l); border-color:var(--st-l)}
  .sb-pick button[data-p="n"].on{background:var(--st-n-bg); color:var(--st-n); border-color:var(--st-n)}
  .sb-need{flex:1; font-size:13.5px; color:var(--ink-2); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .sb-close{
    flex-shrink:0; width:44px; height:46px; border-radius:9px; font-size:16px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  }

  .sb-roster{
    display:grid; gap:3px; padding:8px 14px 2px 78px;
    font-size:12.5px; color:var(--ink-2); line-height:1.5; word-break:keep-all;
  }
  .sb-roster[hidden]{display:none}
  .sb-roster b{font-weight:700; margin-right:5px}
  .sb-roster .y b{color:var(--st-y)} .sb-roster .l b{color:var(--st-l)}
  .sb-roster .n b{color:var(--st-n)} .sb-roster .u b{color:var(--ink-3)}
  .sb-admin{display:flex; gap:6px; padding:6px 0 0 78px}
  .sb-admin .btn{min-height:32px; padding:4px 10px; font-size:12.5px}
  .past-toggle{margin-top:10px; align-self:flex-start}
  .sched-foot{display:flex; gap:8px; margin-top:12px}

  /* ── 가사집 ─────────────────────── */
  .lyrics-col{max-width:660px}
  .songcard{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:16px;
  }
  .songcard .head{display:flex; align-items:baseline; gap:12px; margin-bottom:8px; flex-wrap:wrap}
  .songcard .head h2{
    font-family:"Do Hyeon", sans-serif; font-weight:400; font-size:22px; margin:0; flex:1; min-width:140px;
  }
  .songcard .head .tno{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--accent)}
  .lyric-body p{margin:0 0 4px; white-space:pre-wrap}
  .lyric-body .sec{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; letter-spacing:.12em;
    color:var(--accent); margin:16px 0 6px; font-weight:500;
  }
  .lyric-body .sec:first-child{margin-top:4px}
  .lyric-body .echo{color:var(--ink-3); font-size:13px}
  .lyric-edit textarea{
    width:100%; min-height:220px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface-2); padding:12px 14px; line-height:1.7; resize:vertical;
  }
  .lyric-edit .row{display:flex; gap:8px; margin-top:10px}
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}

  /* ── 악보 (PDF 뷰어) ─────────────── */
  .doc-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
  .doc-chips{display:flex; gap:6px; flex-wrap:wrap; flex:1}
  .doc-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-size:13.5px; color:var(--ink);
  }
  .doc-chip.on{border-color:var(--accent); background:var(--accent-soft); font-weight:700}
  .doc-actions{display:flex; gap:6px}
  .doc-actions a{text-decoration:none; display:inline-flex; align-items:center}
  .pdf-pages{display:flex; flex-direction:column; gap:12px; align-items:center}
  .pdf-pages canvas{
    width:100%; max-width:860px; height:auto; display:block;
    background:#fff; border-radius:4px; box-shadow:0 1px 8px rgba(0,0,0,.14);
  }
  .pdf-msg{color:var(--ink-3); font-size:13.5px; padding:24px 0; text-align:center}
  .pdf-msg a{color:var(--accent)}

  /* ── 자료실 ─────────────────────── */
  .files-list{display:flex; flex-direction:column; gap:8px; max-width:760px}
  .filerow{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .filerow .f-ic{
    width:38px; height:38px; border-radius:8px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-size:10.5px; font-weight:500; color:var(--accent);
  }
  .filerow .f-info{flex:1; min-width:0}
  .filerow .f-name{font-weight:500; font-size:14.5px}
  .filerow .f-meta{font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-3)}
  .filerow a.btn{text-decoration:none; display:inline-flex; align-items:center}
  .f-player{margin:2px 0 6px}
  .f-player video,.f-player audio{width:100%; max-width:760px; display:block; border-radius:8px}

  /* ── 모바일 ─────────────────────── */
  @media (max-width:820px){
    .blocking{display:flex; flex-direction:column; gap:12px}
    .cuelist{
      flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .cuelist::-webkit-scrollbar{display:none}
    .cuegroup{display:contents}
    .cuegroup .song-h{display:none}
    .cue{width:auto; flex-shrink:0; margin-bottom:0; white-space:nowrap; padding:8px 12px}
    .cue .no{min-width:auto}
  }
  @media (max-width:430px){
    nav.tabs button{padding:12px 6px 13px; font-size:13.5px}
    .save-chip{padding:6px 8px}
    .save-chip span:last-child{display:none}
  }
  @media (max-width:640px){
    body{font-size:14.5px}
    nav.tabs{overflow-x:auto; scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{padding:12px 7px 13px; font-size:14px}
    .me-bar{gap:8px}
    .me-bar #btn-att-refresh{min-height:34px; padding:4px 10px; font-size:15px}
    .me-bar #btn-att-refresh .lb{display:none}
    .sbar-face{padding:9px 8px 9px 11px; gap:9px; min-height:64px; border-radius:10px}
    .sb-date{width:56px}
    .sb-date b{font-size:21px}
    .sb-con{font-size:14px}
    .sb-check{min-width:60px; padding:0 10px}
    .sb-pick button{font-size:14px}
    .sb-roster{padding-left:11px}
    .sb-admin{padding-left:0}
    .wrap{padding:0 12px 48px}
    .topbar{margin:0 -12px 14px; padding:2px 12px 0}
    nav.tabs button{padding:12px 10px 13px; font-size:14.5px}
    .save-chip span:last-child{max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .stage{aspect-ratio:4/3; border-radius:6px}
    .mchip .dot{width:31px; height:31px; font-size:10.5px; border-width:2.5px}
    .mchip .tag{font-size:9.5px}
    .pchip{width:30px; height:36px}
    .cue-meta{padding:12px 13px}
    .cue-actions .btn{flex:1 1 45%}
    .songcard{padding:15px 16px}
    .filerow{flex-wrap:wrap}
    .filerow .f-info{flex:1 1 60%}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-v="sched">일정표</button>
      <button role="tab" aria-selected="false" data-v="blocking">동선표</button>
      <button role="tab" aria-selected="false" data-v="lyrics">가사집</button>
      <button role="tab" aria-selected="false" data-v="scores">악보</button>
      <button role="tab" aria-selected="false" data-v="files">자료실</button>
    </nav>
    <button class="save-chip" id="save-chip" data-s="idle"><span class="dot"></span><span id="save-label">보기 전용</span></button>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="row" id="admin-login-row">
      <input type="password" id="admin-pin" placeholder="관리자 비밀번호" autocomplete="current-password">
      <button class="btn primary" id="btn-login">관리자 로그인</button>
      <button class="btn" id="btn-srv-test">서버 진단</button>
    </div>
    <div class="row admin-only">
      <button class="btn" id="btn-change-pin">비밀번호 변경</button>
      <button class="btn" id="btn-reset-site">저장소 기본값으로 되돌리기</button>
      <button class="btn" id="btn-logout">로그아웃</button>
    </div>
    <p class="hint" id="admin-hint"></p>
    <p class="hint msg" id="admin-msg" hidden></p>
    <details class="srv">
      <summary>서버 주소 직접 지정 (테스트용 · 이 기기만)</summary>
      <div class="row">
        <input type="url" id="srv-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
        <button class="btn" id="btn-srv-save">적용</button>
      </div>
    </details>
  </div>

  <!-- 일정표 -->
  <section class="view on" id="view-sched">
    <div class="me-bar">
      <div class="me-set" id="me-set">
        <label for="me-sel">누구세요? <small>한 번만 고르면 이 기기에서 계속 기억해요</small></label>
        <select id="me-sel"></select>
      </div>
      <div class="me-now" id="me-now"><b id="me-name"></b><button class="me-change" id="btn-me-change">변경</button></div>
      <span class="spacer"></span>
      <span class="sync-chip" id="att-sync" data-s="idle"><span class="dot"></span><span id="att-sync-label">준비 중…</span></span>
      <button class="btn" id="btn-att-refresh" aria-label="새로고침"><span class="ic">↻</span><span class="lb">새로고침</span></button>
    </div>
    <div class="sched-list" id="sched-list"></div>
    <div class="sched-foot admin-only">
      <button class="btn" id="btn-add-session">＋ 회차 추가</button>
    </div>
  </section>

  <!-- 동선표 -->
  <section class="view" id="view-blocking">
    <div class="blocking">
      <aside class="cuelist" id="cuelist"></aside>
      <div class="stage-panel">
        <div class="stage" id="stage">
          <span class="edge back">UPSTAGE</span>
          <span class="edge sl">하수 SL</span>
          <span class="edge sr">상수 SR</span>
          <div class="tape-center"></div>
          <div class="apron">객석 AUDIENCE</div>
        </div>
        <div class="cue-nav">
          <button class="btn" id="btn-prev" aria-label="이전 대형">◀</button>
          <div class="cue-now" id="cue-now"></div>
          <button class="btn" id="btn-next" aria-label="다음 대형">▶</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="cue-meta">
          <div>
            <label for="cue-label">대형 이름</label>
            <input type="text" id="cue-label" autocomplete="off">
          </div>
          <div>
            <label for="cue-note">동선 메모</label>
            <textarea id="cue-note" placeholder="큐 타이밍, 이동 순서, 조명 신호 등"></textarea>
          </div>
          <div class="cue-actions admin-only">
            <button class="btn" id="btn-add-mic">＋ 스탠딩 마이크</button>
            <button class="btn" id="btn-add-chair">＋ 의자</button>
            <button class="btn" id="btn-dup">현재 대형 복제</button>
            <button class="btn warn" id="btn-del">이 대형 삭제</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 가사집 -->
  <section class="view" id="view-lyrics">
    <div class="lyrics-col" id="lyrics-col"></div>
  </section>

  <!-- 악보 -->
  <section class="view" id="view-scores">
    <div class="doc-bar">
      <div class="doc-chips" id="doc-chips"></div>
      <div class="doc-actions" id="doc-actions"></div>
    </div>
    <div class="pdf-pages" id="pdf-pages"></div>
  </section>

  <!-- 자료실 -->
  <section class="view" id="view-files">
    <div class="files-list" id="files-list"></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  // 서버(Apps Script 웹 앱) 주소 — apps-script/README.md 대로 배포한 뒤 .../exec 를 넣는다.
  // 비어 있으면 보기 전용으로 동작하고 출결은 각자 기기에만 남는다.
  var SERVER = "https://script.google.com/macros/s/AKfycbwjQexVoPotuV1vqO3giKNc_hVenbZT5AzDuP3QADyH2mlF7KHLDu1b1oRQoKNGYfg68A/exec";
  var PIN_KEY = "stage-binder-pin", SERVER_KEY = "stage-binder-server";

  var state = JSON.parse(document.getElementById("app-state").textContent);

  function migrate(st){
    (st.scenes || []).forEach(function(c){ if (!c.props) c.props = []; });
    if (!st.scoreDocs) st.scoreDocs = [];
    if (!st.files) st.files = [];
    if (!st.sessions) st.sessions = [];
    st.sessions.forEach(function(s){
      if (!s.start) s.start = "19:00";
      if (!s.end) s.end = "21:00";
      if (typeof s.concept !== "string") s.concept = "";
      s.off = !!s.off;
    });
    return st;
  }
  migrate(state);

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function songById(id){ return state.songs.find(function(s){ return s.id===id; }); }
  function newId(prefix){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36); }

  /* ── 서버 · 관리자 ─────────────── */
  function serverUrl(){
    var o = "";
    try{ o = localStorage.getItem(SERVER_KEY) || ""; }catch(e){}
    return (o || SERVER).trim();
  }
  function pin(){ try{ return localStorage.getItem(PIN_KEY) || ""; }catch(e){ return ""; } }
  function isAdmin(){ return !!pin() && !!serverUrl(); }

  var chip = document.getElementById("save-chip");
  var chipLabel = document.getElementById("save-label");
  function setStatus(s, label){ chip.dataset.s = s; chipLabel.textContent = label; }

  async function readJson(r){
    if (!r.ok) throw new Error("http " + r.status);
    var text = await r.text();
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if (!j || typeof j !== "object"){
      throw new Error(/<html|<!doctype|<script/i.test(text) ? "html" : "bad");
    }
    return j;
  }
  async function apiPost(body){
    var r = await fetch(serverUrl(), {
      method: "POST",
      redirect: "follow",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    });
    return readJson(r);
  }
  async function apiGet(){
    var base = serverUrl();
    var r = await fetch(base + (base.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), {cache:"no-store", redirect:"follow"});
    var j = await readJson(r);
    if (!j.ok) throw new Error("bad");
    return j;
  }
  // 왜 실패했는지 사람이 읽을 수 있게
  function explainErr(e){
    var m = String((e && e.message) || e || "");
    if (m === "html") return "서버가 JSON 대신 웹페이지를 보냈어요 — 배포 설정에서 '액세스 권한: 모든 사용자', '실행 사용자: 나'인지 확인 후 새 버전으로 다시 배포";
    if (m === "bad") return "서버 응답 형식이 이상해요 — server.gs가 전부 붙여넣어졌는지 확인";
    if (/^http /.test(m)) return "서버 오류 (HTTP " + m.slice(5) + ")";
    return "네트워크/CORS 오류 — 서버 주소가 .../exec 로 끝나는지, 인터넷 연결 확인";
  }
  function adminMsg(text){
    var el = document.getElementById("admin-msg");
    el.hidden = !text;
    el.textContent = text || "";
  }

  var saveTimer = null, failCount = 0, serverHasPin = false;
  function schedulePersist(){
    if (!isAdmin()) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 1500);
  }
  async function persist(){
    saveTimer = null;
    if (!isAdmin()) return;
    setStatus("saving", "저장 중…");
    try{
      var j = await apiPost({action:"saveSite", pin: pin(), site: state});
      if (!j.ok){
        if (j.error === "bad_pin"){ logout(); setStatus("error", "비밀번호가 바뀌었어요"); return; }
        throw new Error(j.error || "save");
      }
      failCount = 0;
      setStatus("saved", "저장됨");
    }catch(e){
      failCount++;
      if (failCount <= 3){ setStatus("saving", "저장 재시도…"); schedulePersist(); }
      else { failCount = 0; setStatus("error", "저장 실패"); }
    }
  }

  function applyMode(){
    var admin = isAdmin();
    document.body.classList.toggle("admin", admin);
    document.getElementById("cue-label").readOnly = !admin;
    document.getElementById("cue-note").readOnly = !admin;
    document.getElementById("admin-login-row").style.display = admin ? "none" : "";
    setStatus(admin ? "saved" : "idle", admin ? "관리자" : (serverUrl() ? "보기 전용" : "보기 전용 · 서버 없음"));
    var hint = document.getElementById("admin-hint");
    if (!serverUrl()){
      hint.textContent = "아직 서버가 연결되지 않았어요. 관리자 편집과 출결 공유는 서버를 연결한 뒤 가능합니다 (apps-script/README.md).";
    }else if (admin){
      hint.textContent = "관리자로 편집 중입니다. 바꾼 내용은 1~2초 뒤 자동 저장되고 모두에게 반영됩니다.";
    }else if (!serverHasPin){
      hint.textContent = "아직 관리자 비밀번호가 없어요. 지금 입력하는 비밀번호(4자 이상)가 관리자 비밀번호로 정해집니다.";
    }else{
      hint.textContent = "편집은 관리자만 가능합니다. 비밀번호는 이 브라우저에만 저장됩니다.";
    }
    document.getElementById("btn-login").disabled = !serverUrl();
    try{ document.getElementById("srv-url").value = localStorage.getItem(SERVER_KEY) || ""; }catch(e){}
    renderLyrics();
    renderSched();
  }
  function logout(){
    try{ localStorage.removeItem(PIN_KEY); }catch(e){}
    document.getElementById("admin-panel").classList.remove("on");
    applyMode();
  }

  chip.addEventListener("click", function(){
    document.getElementById("admin-panel").classList.toggle("on");
  });
  document.getElementById("btn-login").addEventListener("click", async function(){
    var p = document.getElementById("admin-pin").value;
    if (!serverUrl()) return;
    if (p.length < 4){ setStatus("error", "4자 이상 입력"); return; }
    setStatus("saving", "확인 중…");
    try{
      adminMsg("");
      var j = await apiPost({action:"login", pin:p});
      if (!j.ok){
        setStatus("error", j.error === "bad_pin" ? "비밀번호가 달라요" : "로그인 실패");
        adminMsg(j.error === "bad_pin" ? "비밀번호가 달라요." : "로그인 실패: " + (j.error || "?"));
        return;
      }
      try{ localStorage.setItem(PIN_KEY, p); }catch(e){}
      serverHasPin = true;
      document.getElementById("admin-pin").value = "";
      document.getElementById("admin-panel").classList.remove("on");
      applyMode();
      if (j.created) alert("이 비밀번호가 관리자 비밀번호로 정해졌어요. 잊지 마세요!");
    }catch(e){
      setStatus("error", "서버 연결 실패");
      adminMsg("서버 연결 실패: " + explainErr(e));
      document.getElementById("admin-panel").classList.add("on");
    }
  });
  document.getElementById("admin-pin").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("btn-login").click();
  });
  document.getElementById("btn-change-pin").addEventListener("click", async function(){
    if (!isAdmin()) return;
    var n = prompt("새 관리자 비밀번호 (4자 이상)");
    if (n === null) return;
    if (n.length < 4){ alert("4자 이상이어야 해요."); return; }
    try{
      var j = await apiPost({action:"changePin", pin: pin(), newPin: n});
      if (!j.ok) throw 0;
      try{ localStorage.setItem(PIN_KEY, n); }catch(e){}
      alert("바꿨어요.");
    }catch(e){ alert("변경 실패"); }
  });
  document.getElementById("btn-reset-site").addEventListener("click", async function(){
    if (!isAdmin()) return;
    if (!confirm("서버에 저장된 동선·가사·일정 데이터를 지우고 저장소의 data.json 기본값으로 되돌릴까요? (출결은 그대로)")) return;
    try{
      var j = await apiPost({action:"resetSite", pin: pin()});
      if (!j.ok) throw 0;
      location.reload();
    }catch(e){ alert("되돌리기 실패"); }
  });
  document.getElementById("btn-srv-save").addEventListener("click", function(){
    var v = document.getElementById("srv-url").value.trim();
    try{ v ? localStorage.setItem(SERVER_KEY, v) : localStorage.removeItem(SERVER_KEY); }catch(e){}
    location.reload();
  });
  document.getElementById("btn-srv-test").addEventListener("click", async function(){
    if (!serverUrl()){ adminMsg("서버 주소가 없어요."); return; }
    adminMsg("진단 중…");
    var lines = ["주소: " + serverUrl()];
    try{ var g = await apiGet(); lines.push("읽기(GET): OK · 비밀번호 " + (g.hasPin ? "설정됨" : "아직 없음") + " · 서버 데이터 " + (g.site ? "있음" : "없음")); }
    catch(e){ lines.push("읽기(GET): 실패 — " + explainErr(e)); }
    try{ var p = await apiPost({action:"ping"}); lines.push("쓰기(POST): " + (p && p.error === "bad_action" ? "OK" : "응답 이상 " + JSON.stringify(p).slice(0, 60))); }
    catch(e2){ lines.push("쓰기(POST): 실패 — " + explainErr(e2)); }
    adminMsg(lines.join("\n"));
  });
  document.getElementById("btn-logout").addEventListener("click", logout);

  // 1) 저장소의 data.json (기본값) → 2) 서버에 관리자가 저장한 데이터가 있으면 그걸로 덮어씀
  var serverApplied = false;
  fetch("data.json", {cache:"no-store"})
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(j){ if (!serverApplied){ state = migrate(j); renderAll(); } })
    .catch(function(){});

  /* ── 탭 ─────────────────────── */
  document.querySelector("nav.tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-v]");
    if (!btn) return;
    document.querySelectorAll("nav.tabs button").forEach(function(b){
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("on"); });
    document.getElementById("view-" + btn.dataset.v).classList.add("on");
    if (btn.dataset.v === "scores") loadCurDoc();
    if (btn.dataset.v === "sched"){ maybePull(); renderSched(); }
  });

  /* ── 동선표 ─────────────────────── */
  var curSceneId = state.scenes.length ? state.scenes[0].id : null;
  var selPropId = null;
  var stage = document.getElementById("stage");

  function curScene(){ return state.scenes.find(function(c){ return c.id===curSceneId; }); }
  function sceneIndex(){ return state.scenes.findIndex(function(c){ return c.id===curSceneId; }); }

  function gotoScene(id, animate){
    curSceneId = id; selPropId = null;
    renderCueList(); renderStage(animate); renderCueMeta();
    var onBtn = document.querySelector('.cue[data-cue="' + id + '"]');
    if (onBtn && onBtn.scrollIntoView){
      onBtn.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
    }
  }

  function renderCueList(){
    var host = document.getElementById("cuelist");
    var html = "";
    state.songs.forEach(function(song, si){
      var scenes = state.scenes.filter(function(c){ return c.songId === song.id; });
      if (!scenes.length) return;
      html += '<div class="cuegroup"><h3 class="song-h">' + (si+1) + '. ' + esc(song.title) + '</h3>';
      scenes.forEach(function(c){
        var no = state.scenes.indexOf(c) + 1;
        html += '<button class="cue' + (c.id===curSceneId ? ' on' : '') + '" data-cue="' + c.id + '">' +
          '<span class="no">CUE ' + String(no).padStart(2,"0") + '</span>' +
          '<span>' + esc(c.label) + '</span></button>';
      });
      html += '</div>';
    });
    host.innerHTML = html;
  }
  document.getElementById("cuelist").addEventListener("click", function(e){
    var btn = e.target.closest("[data-cue]");
    if (!btn) return;
    gotoScene(btn.dataset.cue, true);
  });

  document.getElementById("btn-prev").addEventListener("click", function(){
    var i = sceneIndex();
    if (i > 0) gotoScene(state.scenes[i-1].id, true);
  });
  document.getElementById("btn-next").addEventListener("click", function(){
    var i = sceneIndex();
    if (i >= 0 && i < state.scenes.length - 1) gotoScene(state.scenes[i+1].id, true);
  });

  function propSvg(type){
    if (type === "mic"){
      // 스탠딩 마이크: 헤드 + 폴 + 삼각 베이스
      return '<svg viewBox="0 0 34 40" aria-hidden="true">' +
        '<circle cx="17" cy="7" r="5" fill="currentColor"/>' +
        '<rect x="16" y="12" width="2" height="20" rx="1" fill="currentColor"/>' +
        '<path d="M8 37 L17 30 L26 37 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
        '</svg>';
    }
    // 의자(스툴): 좌판 + 다리
    return '<svg viewBox="0 0 34 40" aria-hidden="true">' +
      '<rect x="7" y="10" width="20" height="6" rx="2" fill="currentColor"/>' +
      '<line x1="10" y1="16" x2="8" y2="34" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="24" y1="16" x2="26" y2="34" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="17" y1="16" x2="17" y2="32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
      '</svg>';
  }

  function renderStage(animate){
    stage.querySelectorAll(".mchip, .pchip, .spike").forEach(function(n){ n.remove(); });
    [[25,33],[75,33],[25,66],[75,66],[50,50]].forEach(function(p){
      var s = document.createElement("div");
      s.className = "spike"; s.style.left = p[0] + "%"; s.style.top = p[1] + "%";
      stage.appendChild(s);
    });
    var sc = curScene();
    if (!sc) return;
    sc.props.forEach(function(p){
      var el = document.createElement("div");
      el.className = "pchip" + (animate ? " anim" : "") + (p.id === selPropId ? " sel" : "");
      el.dataset.pid = p.id;
      el.style.left = p.x + "%";
      el.style.top = p.y + "%";
      el.innerHTML = propSvg(p.type) +
        '<button class="px" data-px="' + p.id + '" aria-label="소품 삭제">✕</button>';
      stage.appendChild(el);
    });
    state.members.forEach(function(m){
      var pos = sc.positions[m.id] || [50,50];
      var el = document.createElement("div");
      el.className = "mchip" + (animate ? " anim" : "");
      el.dataset.mid = m.id;
      el.style.setProperty("--c", m.color);
      el.style.left = pos[0] + "%";
      el.style.top = pos[1] + "%";
      el.innerHTML = '<span class="dot">' + esc(m.name) + '</span><span class="tag">' + esc(m.short || m.name) + '</span>';
      stage.appendChild(el);
    });
  }

  // 드래그 (멤버 + 소품 공통, 관리자 전용) / 짧은 탭이면 소품 선택 토글
  var dragEl = null, dragMoved = false, downX = 0, downY = 0;
  stage.addEventListener("pointerdown", function(e){
    if (!isAdmin()) return;
    if (e.target.closest(".px")) return; // 삭제 버튼은 클릭으로 처리
    var chipEl = e.target.closest(".mchip, .pchip");
    if (!chipEl){
      if (selPropId){ selPropId = null; renderStage(false); }
      return;
    }
    dragEl = chipEl; dragMoved = false;
    downX = e.clientX; downY = e.clientY;
    chipEl.classList.add("drag");
    chipEl.classList.remove("anim");
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener("pointermove", function(e){
    if (!dragEl) return;
    if (!dragMoved && Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 6) return;
    dragMoved = true;
    var r = stage.getBoundingClientRect();
    var x = Math.min(97, Math.max(3, (e.clientX - r.left) / r.width * 100));
    var y = Math.min(82, Math.max(6, (e.clientY - r.top) / r.height * 100));
    dragEl.style.left = x + "%";
    dragEl.style.top = y + "%";
  });
  function endDrag(){
    if (!dragEl) return;
    var el = dragEl;
    dragEl = null;
    el.classList.remove("drag");
    var sc = curScene();
    if (!sc) return;
    if (!dragMoved){
      // 짧은 탭: 소품이면 선택 토글
      if (el.dataset.pid){
        selPropId = (selPropId === el.dataset.pid) ? null : el.dataset.pid;
        renderStage(false);
      }else if (selPropId){
        selPropId = null; renderStage(false);
      }
      return;
    }
    var x = Math.round(parseFloat(el.style.left) * 10) / 10;
    var y = Math.round(parseFloat(el.style.top) * 10) / 10;
    if (el.dataset.mid){
      sc.positions[el.dataset.mid] = [x, y];
    }else if (el.dataset.pid){
      var p = sc.props.find(function(q){ return q.id === el.dataset.pid; });
      if (p){ p.x = x; p.y = y; }
    }
    schedulePersist();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("click", function(e){
    if (!isAdmin()) return;
    var px = e.target.closest("[data-px]");
    if (!px) return;
    var sc = curScene(); if (!sc) return;
    var idx = sc.props.findIndex(function(p){ return p.id === px.dataset.px; });
    if (idx >= 0){
      sc.props.splice(idx, 1);
      selPropId = null;
      renderStage(false);
      schedulePersist();
    }
  });

  function addProp(type){
    var sc = curScene(); if (!sc) return;
    var p = {id: newId("p"), type: type, x: 50, y: 50};
    sc.props.push(p);
    selPropId = p.id;
    renderStage(false);
    schedulePersist();
  }
  document.getElementById("btn-add-mic").addEventListener("click", function(){ addProp("mic"); });
  document.getElementById("btn-add-chair").addEventListener("click", function(){ addProp("chair"); });

  function renderLegend(){
    document.getElementById("legend").innerHTML = state.members.map(function(m){
      return '<span style="--c:' + m.color + '"><i></i>' + esc(m.name) + ' · ' + esc(m.role) + '</span>';
    }).join("");
  }

  var labelInput = document.getElementById("cue-label");
  var noteInput = document.getElementById("cue-note");
  function renderCueMeta(){
    var sc = curScene();
    labelInput.value = sc ? sc.label : "";
    noteInput.value = sc ? sc.note : "";
    var i = sceneIndex();
    document.getElementById("cue-now").textContent =
      sc ? "CUE " + String(i+1).padStart(2,"0") + " — " + sc.label : "";
    document.getElementById("btn-prev").disabled = i <= 0;

  /* ── 악보 (PDF 뷰어) ─────────────── */
  if (window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  var curDocId = null, loadedDocId = null;
  function renderScoreDocs(){
    var docs = state.scoreDocs || [];
    if (!docs.find(function(d){ return d.id===curDocId; })){
      curDocId = docs.length ? docs[0].id : null;
    }
    document.getElementById("doc-chips").innerHTML = docs.map(function(d){
      return '<button class="doc-chip' + (d.id===curDocId ? ' on' : '') + '" data-doc="' + d.id + '">' + esc(d.title) + '</button>';
    }).join("");
    var cur = docs.find(function(d){ return d.id===curDocId; });
    document.getElementById("doc-actions").innerHTML = cur
      ? '<a class="btn" href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭</a>' +
        '<a class="btn" href="' + esc(cur.path) + '" download>다운로드</a>'
      : "";
  }
  function loadCurDoc(){
    var docs = state.scoreDocs || [];
    var cur = docs.find(function(d){ return d.id===curDocId; });
    var host = document.getElementById("pdf-pages");
    if (!cur){ host.innerHTML = '<p class="pdf-msg">등록된 악보가 없어요.</p>'; return; }
    if (loadedDocId === cur.id) return;
    loadedDocId = cur.id;
    if (!window.pdfjsLib){
      host.innerHTML = '<p class="pdf-msg">PDF 미리보기를 불러오지 못했어요 — <a href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭에서 열기</a></p>';
      return;
    }
    host.innerHTML = '<p class="pdf-msg">악보 불러오는 중…</p>';
    pdfjsLib.getDocument(cur.path).promise.then(function(pdf){
      if (loadedDocId !== cur.id) return;
      host.innerHTML = "";
      var width = Math.min(host.clientWidth || 800, 860);
      var chain = Promise.resolve();
      for (var p = 1; p <= pdf.numPages; p++){
        (function(pageNo){
          var canvas = document.createElement("canvas");
          host.appendChild(canvas);
          chain = chain.then(function(){
            return pdf.getPage(pageNo).then(function(page){
              var vp1 = page.getViewport({scale:1});
              var scale = width / vp1.width * Math.min(window.devicePixelRatio || 1, 2);
              var vp = page.getViewport({scale:scale});
              canvas.width = vp.width; canvas.height = vp.height;
              return page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
            });
          });
        })(p);
      }
    }).catch(function(){
      if (loadedDocId !== cur.id) return;
      host.innerHTML = '<p class="pdf-msg">PDF 미리보기 실패 — <a href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭에서 열기</a></p>';
    });
  }
  document.getElementById("doc-chips").addEventListener("click", function(e){

    renderScoreDocs(); loadCurDoc();
  });

  /* ── 자료실 ─────────────────────── */
  var FILE_ICON = {pdf:"PDF", audio:"MP3", video:"MP4"};

  /* ── 일정표 · 출결 ───────────────── */
  var ME_KEY = "stage-binder-me", ATT_KEY = "stage-binder-att";
  var ST_NAME = {y:"출석", l:"지각", n:"결석", "":"미응답"};
  var WD = ["일","월","화","수","목","금","토"];
  var att = {}, meId = "", pulledFor = null, showPast = false;
  var flipped = {}, openRoster = {};

  try{ meId = localStorage.getItem(ME_KEY) || ""; }catch(e){}
  try{ att = JSON.parse(localStorage.getItem(ATT_KEY) || "{}") || {}; }catch(e){ att = {}; }
  function saveAttLocal(){ try{ localStorage.setItem(ATT_KEY, JSON.stringify(att)); }catch(e){} }

  function sessionList(){
    return (state.sessions || []).slice().sort(function(a,b){
      return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0;
    });
  }
  function sessionById(id){ return (state.sessions || []).find(function(s){ return s.id === id; }); }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(iso){ var a = String(iso).split("-"); return [+a[0], +a[1], +a[2]]; }
  function weekday(iso){ var p = ymd(iso); return WD[new Date(p[0], p[1]-1, p[2]).getDay()]; }
  function shortDate(iso){ var p = ymd(iso); return p[1] + "/" + p[2]; }
  function fullDate(iso){ var p = ymd(iso); return p[1] + "월 " + p[2] + "일 (" + weekday(iso) + ")"; }
  function dday(iso){
    var p = ymd(iso), a = new Date(p[0], p[1]-1, p[2]), t = new Date();
    t.setHours(0,0,0,0);
    return Math.round((a - t) / 86400000);
  }
  function statusOf(sid, mid){ return (att[sid] || {})[mid] || ""; }
  function countOf(sid){
    var c = {y:0, l:0, n:0, u:0};
    (state.members || []).forEach(function(m){ c[statusOf(sid, m.id) || "u"]++; });
    return c;
  }

  /* 동기화 */
  var syncChip = document.getElementById("att-sync");

  // 서버에서 출결(+관리자가 저장한 사이트 데이터) 가져오기
  async function pullAll(silent, initial){
    if (!serverUrl()){ setSync("idle", "이 기기에만 저장"); return; }
    if (!silent) setSync("busy", "불러오는 중…");
    try{
      var j = await apiGet();
      serverHasPin = !!j.hasPin;
      att = (j.att && typeof j.att === "object") ? j.att : {};
      saveAttLocal();
      // 관리자가 편집 중일 땐 화면을 갈아엎지 않는다 (처음 로드는 예외)
      if (j.site && (initial || (!isAdmin() && editingSong === null))){
        serverApplied = true;
        state = migrate(j.site);
        renderAll();
      }else{
        renderSched();
      }
      setSync("ok", "모두와 공유됨");
      if (!isAdmin()) applyMode();
    }catch(e){
      setSync("err", "서버 연결 실패");
      adminMsg("서버 연결 실패: " + explainErr(e));
    }
  }
  async function pushAtt(sid, mid, status){
    if (!att[sid]) att[sid] = {};
    if (status) att[sid][mid] = status; else delete att[sid][mid];
    saveAttLocal();
    if (!serverUrl()){ setSync("idle", "이 기기에만 저장"); return; }
    setSync("busy", "저장 중…");
    try{
      var j = await apiPost({action:"att", sessionId: sid, memberId: mid, status: status});
      if (!j.ok) throw 0;
      if (j.att){ att = j.att; saveAttLocal(); renderSched(); }
      setSync("ok", "저장됨 · 공유");
    }catch(e){
      setSync("err", "저장 실패 — 새로고침 후 다시");
    }
  }
  function maybePull(){
    var base = serverUrl();
    if (!base){ setSync("idle", "이 기기에만 저장"); return; }
    if (pulledFor !== base){ pulledFor = base; pullAll(true, true); }
  }

  /* 내 이름 — 한 번 고르면 기기에 저장, 이후엔 한 줄로 접힘 */
  var meSel = document.getElementById("me-sel");

  function renderMeSelect(){
    var ms = state.members || [];

    meSel.innerHTML = '<option value="">— 이름을 골라주세요 —</option>' + ms.map(function(m){

  meSel.addEventListener("change", function(){

  document.getElementById("btn-me-change").addEventListener("click", askMe);

  /* 바 하나 */
  function countHtml(sid){
    var c = countOf(sid);
    return '<button class="cnt" data-roster="' + esc(sid) + '" title="명단 보기">' +
      '<i class="y">출 ' + c.y + "</i><i class=\"l\">지 " + c.l + "</i><i class=\"n\">결 " + c.n + "</i></button>";
  }
  function rosterHtml(sid){
    return [["y","출석"],["l","지각"],["n","결석"],["u","미응답"]].map(function(g){
      var names = (state.members || []).filter(function(m){
        return (statusOf(sid, m.id) || "u") === g[0];
      }).map(function(m){ return m.name + "(" + m.short + ")"; });
      return '<div class="' + g[0] + '"><b>' + g[1] + " " + names.length + "</b>" +
        (names.length ? esc(names.join(", ")) : "—") + "</div>";
    }).join("");
  }
  function barHtml(s){
    var d = dday(s.dateISO), my = statusOf(s.id, meId), admin = isAdmin();
    var cls = "sbar" + (s.off ? " off" : "") + (d === 0 ? " today" : "") + (d < 0 ? " past" : "") +
      (flipped[s.id] && !s.off ? " flip" : "") + (openRoster[s.id] ? " open" : "");
    var badge = s.off ? "휴강" : d === 0 ? "오늘" : d > 0 ? "D-" + d : "";
    var dateBlock = '<div class="sb-date"><b>' + esc(shortDate(s.dateISO)) + "</b><span>" +
      esc(weekday(s.dateISO)) + (badge ? "<em>" + esc(badge) + "</em>" : "") + "</span></div>";

    var con = admin
      ? '<input class="sb-con-in" data-con="' + esc(s.id) + '" value="' + esc(s.concept || "") + '" placeholder="수업 내용 — 예: 안무 위주 / 화음 위주">'
      : '<div class="sb-con' + (s.concept ? "" : " empty") + '">' + esc(s.off ? "휴강" : (s.concept || "내용 미정")) + "</div>";

    var front = '<div class="sbar-face front">' + dateBlock +
      '<div class="sb-info">' + con +
        '<div class="sb-meta"><span>' + esc(s.start) + "–" + esc(s.end) + "</span>" + (s.off ? "" : countHtml(s.id)) + "</div>" +
      "</div>" +
      (s.off
        ? ""
        : '<button class="sb-check' + (my ? "" : " none") + '" data-s="' + my + '" data-check="' + esc(s.id) + '">' +
          (my ? ST_NAME[my] : "출첵") + "</button>") +
      "</div>";

    var backBody = meId
      ? '<div class="sb-pick">' + ["y","l","n"].map(function(p){
          return '<button data-pick="' + p + '"' + (my === p ? ' class="on"' : "") + ">" + ST_NAME[p] + "</button>";
        }).join("") + "</div>"
      : '<div class="sb-need">먼저 내 이름을 골라주세요 <button class="btn" data-needme="1">이름 고르기</button></div>';
    var back = '<div class="sbar-face back">' + dateBlock + backBody +
      '<button class="sb-close" data-close="' + esc(s.id) + '" aria-label="닫기">✕</button></div>';

    var adminRow = admin
      ? '<div class="sb-admin">' +
        '<button class="btn" data-off="' + esc(s.id) + '">' + (s.off ? "휴강 해제" : "휴강") + "</button>" +
        '<button class="btn warn" data-del="' + esc(s.id) + '">삭제</button></div>'
      : "";

    return '<div class="' + cls + '" data-ses="' + esc(s.id) + '">' +
      '<div class="sbar-in">' + front + back + "</div>" +
      '<div class="sb-roster"' + (openRoster[s.id] ? "" : " hidden") + ">" + rosterHtml(s.id) + "</div>" +
      adminRow + "</div>";
  }

  function renderSched(){
    var host = document.getElementById("sched-list");
    var ss = sessionList();
    if (!ss.length){ host.innerHTML = '<p class="sched-empty">등록된 회차가 없어요.</p>'; return; }
    var up = ss.filter(function(s){ return dday(s.dateISO) >= 0; });
    var past = ss.filter(function(s){ return dday(s.dateISO) < 0; }).reverse();
    var html = "";
    if (up.length){
      html += '<div class="sched-h">다가오는 연습 · 매주 화 19:00–21:00</div>' + up.map(barHtml).join("");
    }else{
      html += '<p class="sched-empty">예정된 회차가 없어요.</p>';
    }
    if (past.length){
      html += '<button class="btn past-toggle" id="btn-past">' +
        (showPast ? "지난 회차 접기" : "지난 회차 " + past.length + "개 보기") + "</button>";
      if (showPast) html += '<div class="sched-h">지난 회차</div>' + past.map(barHtml).join("");
    }
    host.innerHTML = html;
  }

  /* 바 안에서 DOM만 고쳐서 애니메이션 유지 */
  function patchBar(sid){
    var bar = document.querySelector('.sbar[data-ses="' + sid + '"]');
    if (!bar) return;
    var my = statusOf(sid, meId);
    var chk = bar.querySelector(".sb-check");
    if (chk){
      chk.dataset.s = my;
      chk.classList.toggle("none", !my);
      chk.textContent = my ? ST_NAME[my] : "출첵";
    }
    bar.querySelectorAll("[data-pick]").forEach(function(b){ b.classList.toggle("on", b.dataset.pick === my); });
    var cnt = bar.querySelector(".cnt");
    if (cnt) cnt.outerHTML = countHtml(sid);
    var ro = bar.querySelector(".sb-roster");
    if (ro) ro.innerHTML = rosterHtml(sid);
  }

  document.getElementById("sched-list").addEventListener("click", function(e){
    var b, bar = e.target.closest(".sbar"), sid = bar ? bar.dataset.ses : null;
    if ((b = e.target.closest("[data-check]"))){
      flipped[sid] = true; bar.classList.add("flip");
    }else if ((b = e.target.closest("[data-close]"))){
      flipped[sid] = false; bar.classList.remove("flip");
    }else if ((b = e.target.closest("[data-pick]"))){
      if (!meId) return;
      pushAtt(sid, meId, b.dataset.pick);
      patchBar(sid);
      flipped[sid] = false; bar.classList.remove("flip");
    }else if ((b = e.target.closest("[data-needme]"))){
      flipped[sid] = false; bar.classList.remove("flip");
      askMe();
    }else if ((b = e.target.closest("[data-roster]"))){
      openRoster[sid] = !openRoster[sid];
      bar.classList.toggle("open", openRoster[sid]);
      bar.querySelector(".sb-roster").hidden = !openRoster[sid];
    }else if ((b = e.target.closest("#btn-past"))){
      showPast = !showPast; renderSched();
    }else if ((b = e.target.closest("[data-off]")) && isAdmin()){
      var s = sessionById(b.dataset.off);
      if (!s) return;
      s.off = !s.off; schedulePersist(); renderSched();
    }else if ((b = e.target.closest("[data-del]")) && isAdmin()){
      var s2 = sessionById(b.dataset.del);
      if (!s2 || !confirm(fullDate(s2.dateISO) + " 회차를 삭제할까요?")) return;
      state.sessions = (state.sessions || []).filter(function(x){ return x.id !== s2.id; });
      schedulePersist(); renderSched();
    }
  });
  document.getElementById("sched-list").addEventListener("input", function(e){

  document.getElementById("btn-att-refresh").addEventListener("click", function(){

    pullAll(false, false);
  });
  document.getElementById("btn-add-session").addEventListener("click", function(){
    if (!isAdmin()) return;
    var ss = sessionList(), last = ss[ss.length-1], def = "";
    if (last){
      var p = ymd(last.dateISO), d = new Date(p[0], p[1]-1, p[2] + 7);
      def = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
    }
    var v = prompt("회차 날짜 (YYYY-MM-DD)", def);
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v.trim())) return;
    if (!state.sessions) state.sessions = [];
    state.sessions.push({
      id: newId("t"), dateISO: v.trim(),
      start: last ? last.start : "19:00", end: last ? last.end : "21:00",
      concept: "", off: false
    });
    schedulePersist(); renderSched();
  });

  setInterval(function(){
    if (document.hidden || !serverUrl()) return;
    if (!document.getElementById("view-sched").classList.contains("on")) return;
    pullAll(true, false);
  }, 60000);

  function renderAll(){
    if (!state.scenes.find(function(c){ return c.id===curSceneId; })){
      curSceneId = state.scenes.length ? state.scenes[0].id : null;
    }
    renderCueList(); renderStage(false); renderLegend(); renderCueMeta();
    renderLyrics(); renderScoreDocs(); renderFiles();
    renderMeSelect(); renderSched(); maybePull();
    loadedDocId = null;
    if (document.getElementById("view-scores").classList.contains("on")) loadCurDoc();
  }
  applyMode();
  renderAll();
})();
</script>
</body>
</html>
